# Railway service config for the Django web app (backend/django_app).
#
# This repo is a monorepo (Django + FastAPI + Celery share one image, see
# infrastructure/docker/backend.Dockerfile). Railway can't auto-detect a
# Django app buried under backend/django_app with dependencies declared in
# backend/pyproject.toml, so this file pins the build to the existing,
# already-working Dockerfile rather than re-deriving a build pipeline.
#
# Only ONE Railway service should use this file: the Django web app.
# It does not define a Postgres service (Neon, external, is the database —
# see RAILWAY_DEPLOYMENT.md) and does not start Celery worker/beat or the
# FastAPI edge service; those are out of scope for this deployment.

[build]
builder = "DOCKERFILE"
dockerfilePath = "infrastructure/docker/backend.Dockerfile"

[deploy]
# `migrate --noinput` runs as part of the start command rather than as a
# separate Railway "Pre-deploy command" step. It was originally a
# preDeployCommand (the more common pattern — runs once before the new
# version takes traffic), but on this project that specific step type
# failed on every attempt with zero captured output anywhere (build logs,
# deploy logs, and even Railway's own deployment Diagnosis all came back
# empty), while the identical command placed in startCommand is expected
# to log normally like any other container process. `migrate --noinput`
# is idempotent (Django tracks applied migrations in django_migrations),
# so running it on every start is safe — it's a no-op once the schema is
# current. Only `migrate` — never `flush`, `makemigrations`, or anything
# destructive.
startCommand = "cd django_app && python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
healthcheckPath = "/health/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
