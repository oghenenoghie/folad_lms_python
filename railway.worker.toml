# Dedicated Railway service configuration for the FOLAD CBT import worker.
# Create a separate Railway service from this repository and set its
# Config-as-code file path to railway.worker.toml.
# This service shares the backend image and runtime environment with Django,
# but never runs migrations and never serves HTTP traffic.

[build]
builder = "DOCKERFILE"
dockerfilePath = "infrastructure/docker/backend.Dockerfile"

[deploy]
startCommand = "sh -c 'cd django_app && celery -A config worker -l info -Q imports --concurrency=2'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
