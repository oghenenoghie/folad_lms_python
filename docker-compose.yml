x-backend-env: &backend-env
  env_file:
    - .env

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    depends_on:
      backend-django:
        condition: service_healthy
      backend-fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend-django:
    <<: *backend-env
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    working_dir: /app/django_app
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-fastapi:
    <<: *backend-env
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    working_dir: /app/fastapi_app
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/edge/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    <<: *backend-env
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    working_dir: /app/django_app
    command: celery -A config worker -l info -Q default,reports,imports,email_notify
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-django:
        condition: service_healthy

  celery-beat:
    <<: *backend-env
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    working_dir: /app/django_app
    command: celery -A config beat -l info
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-django:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-sms}
      # The image makes its POSTGRES_USER a superuser, and superusers bypass
      # Row-Level Security. Keep it for admin work (psql, pg_dump); the app
      # never connects as it.
      - POSTGRES_USER=${POSTGRES_SUPERUSER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      # Non-superuser role that Django, FastAPI, Celery and pytest connect
      # as. Created on first init by infrastructure/postgres/initdb/, which
      # also makes it the owner of POSTGRES_DB, the same way CI does.
      - APP_DB_USER=${POSTGRES_USER:-sms_app}
      - APP_DB_PASSWORD=${POSTGRES_PASSWORD:-sms_app}
    volumes:
      # postgres:18+ images keep PGDATA in a version-specific subdirectory
      # (/var/lib/postgresql/18/docker) and refuse to start if a volume is
      # mounted at the pre-18 /var/lib/postgresql/data path.
      - postgres_data:/var/lib/postgresql
      # Init scripts only run when the volume is empty. See docs/README.md
      # ("Database roles") for retrofitting an existing volume.
      - ./infrastructure/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      # Over TCP, not the Unix socket: the entrypoint's temporary init-time
      # server only listens on the socket, so this stays unhealthy until
      # init scripts (including the app role) have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-sms_app} -d ${POSTGRES_DB:-sms}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${STORAGE_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
