[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[project]
name = "sms-backend"
version = "0.1.0"
description = "School Management System backend (Django system-of-record + FastAPI edge service)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.1",
    "djangorestframework>=3.15,<3.16",
    "django-environ>=0.11,<0.12",
    "psycopg[binary]>=3.2,<3.3",
    "fastapi>=0.111,<0.112",
    "uvicorn[standard]>=0.30,<0.31",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "celery>=5.4,<5.5",
    "redis>=5.0,<5.1",
    "gunicorn>=22.0,<23.0",
    "sqlalchemy>=2.0,<2.1",
    "boto3>=1.34,<2.0",
    "pyjwt>=2.8,<2.9",
    "pyotp>=2.9,<2.10",
    "argon2-cffi>=23.1,<24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<8.3",
    "pytest-django>=4.8,<4.9",
    "pytest-asyncio>=0.23,<0.24",
    "httpx>=0.27,<0.28",
    "ruff>=0.5,<0.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["django_app", "fastapi_app", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
