{% load ui_tags %}
<div x-data="{ open: false }" x-on:click.outside="open = false" class="relative inline-block text-left">
  <button type="button" x-on:click="open = !open" class="btn-secondary">
    <span>{{ label }}</span>
    {% ui_icon "chevron-down" "h-4 w-4" %}
  </button>
  <div x-show="open" x-transition x-cloak class="dropdown-panel">
    {{ content }}
  </div>
</div>
