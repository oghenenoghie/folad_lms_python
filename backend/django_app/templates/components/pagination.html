{% if page.paginator.num_pages > 1 %}
<nav class="flex items-center justify-between border-t border-slate-200 px-4 py-3 dark:border-slate-800" aria-label="Pagination">
  <p class="text-sm text-slate-500 dark:text-slate-400">
    Page {{ page.number }} of {{ page.paginator.num_pages }} &middot; {{ page.paginator.count }} total
  </p>
  <div class="flex items-center gap-1">
    {% if page.has_previous %}
    <a class="pagination-link"
       href="?page={{ page.previous_page_number }}{% if base_qs %}&{{ base_qs }}{% endif %}"
       {% if hx_target %}hx-get="?page={{ page.previous_page_number }}{% if base_qs %}&{{ base_qs }}{% endif %}" hx-target="{{ hx_target }}"{% endif %}>Previous</a>
    {% endif %}
    {% if page.has_next %}
    <a class="pagination-link"
       href="?page={{ page.next_page_number }}{% if base_qs %}&{{ base_qs }}{% endif %}"
       {% if hx_target %}hx-get="?page={{ page.next_page_number }}{% if base_qs %}&{{ base_qs }}{% endif %}" hx-target="{{ hx_target }}"{% endif %}>Next</a>
    {% endif %}
  </div>
</nav>
{% endif %}
