{% load ui_tags %}
<nav class="flex items-center text-sm text-slate-500 dark:text-slate-400" aria-label="Breadcrumb">
  {% for label, url in items %}
    {% if not forloop.first %}
      <span class="mx-2">{% ui_icon "chevron-right" "h-4 w-4" %}</span>
    {% endif %}
    {% if url and not forloop.last %}
      <a href="{{ url }}" class="hover:text-slate-700 dark:hover:text-slate-200">{{ label }}</a>
    {% else %}
      <span class="font-medium text-slate-900 dark:text-slate-100">{{ label }}</span>
    {% endif %}
  {% endfor %}
</nav>
