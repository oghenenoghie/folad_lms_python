{% load ui_tags %}
<div class="flex flex-col items-center justify-center rounded-xl border border-dashed border-slate-300 px-6 py-14 text-center dark:border-slate-700">
  <div class="mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-slate-100 text-slate-400 dark:bg-slate-800 dark:text-slate-500">
    {% ui_icon icon "h-6 w-6" %}
  </div>
  <p class="text-sm font-medium text-slate-900 dark:text-slate-100">{{ title }}</p>
  {% if description %}<p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{ description }}</p>{% endif %}
</div>
