worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    limit_req_zone $binary_remote_addr zone=l1_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=l1_auth:10m rate=5r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;

        client_max_body_size 20m;

        location /health {
            access_log off;
            return 200 '{"success":true,"data":{"status":"ok"},"message":"healthy","errors":[]}';
            default_type application/json;
        }

        location /api/v1/auth/ {
            limit_req zone=l1_auth burst=10 nodelay;
            proxy_pass http://backend_django;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/v1/ {
            limit_req zone=l1_general burst=40 nodelay;
            proxy_pass http://backend_django;
            include /etc/nginx/proxy_params.conf;
        }

        location /admin/ {
            proxy_pass http://backend_django;
            include /etc/nginx/proxy_params.conf;
        }

        location ~ ^/(edge|public|webhooks)/ {
            limit_req zone=l1_general burst=40 nodelay;
            proxy_pass http://backend_fastapi;
            include /etc/nginx/proxy_params.conf;
        }

        location / {
            default_type application/json;
            return 404 '{"success":false,"data":{},"message":"Not found. This is an API-only service — see /api/v1, /edge/v1, /docs.","errors":["not_found"]}';
        }
    }

    upstream backend_django {
        server backend-django:8000;
    }

    upstream backend_fastapi {
        server backend-fastapi:8001;
    }
}
